# components.toml — pins the release of each component included in the bundle.
#
# CI in this repo reads these values to download prebuilt artifacts from the
# respective GitHub fork releases and assemble the bundle.
#
# Workflow:
#   1. A component's own CI (in its fork repo) produces a release with artifacts.
#   2. Bump the [component].release field here to promote that release.
#   3. This repo's CI assembles and publishes the new bundle.
#
[kak]
# GitHub fork: kgzm/kak
# Upstream: https://github.com/mawww/kakoune
upstream_commit = "2f7ac6f"  # master as of 2026-05-17
release = "2026.05.21-4670fac7"

[kak-lsp]
# GitHub fork: kgzm/kak-lsp
# Upstream: https://github.com/kakoune-lsp/kakoune-lsp
upstream_version = "20.0.0-snapshot"
upstream_commit = "b090ff6"  # master as of 2026-05-17
release = "2026.05.21-ad5611c"

[kak-tree-sitter]
# GitHub fork: kgzm/kak-tree-sitter
# Upstream: https://git.sr.ht/~hadronized/kak-tree-sitter
upstream_version = "3.2.1"
upstream_commit = "00b43ef"  # our fork — adds cross-build Makefile + Source::Bundled
release = "2026.05.21-9554b7a"
#
# NOTE: binary MUST be glibc (not static musl) — dlopen required for grammars.
# Build flags: --features kak-tree-sitter/direct-unix-socket

[grammars]
# GitHub repo: kgzm/grammars
# Tree-sitter grammar .so files (215), cross-compiled per target arch.
release = "2026.05.20-02851bc"
